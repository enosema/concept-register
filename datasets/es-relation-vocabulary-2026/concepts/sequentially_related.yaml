data:
  language_code: eng
  terms:
  - type: expression
    designation: sequentially_related
    normative_status: preferred
  definition:
  - content: "The related concept follows or precedes the current concept in an unspecified order of sequence."
  notes:
  - content: "This relation type is symmetric: it carries no distinct inverse; the assertion holds in both directions. Relation family: associative-sequential. Source: ISO 704:2022, 5.5.5, Table 1 (sequential); ISO 12620; EFS 2510:2026, 6.4."
status: valid
